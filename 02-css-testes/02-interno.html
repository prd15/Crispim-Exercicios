<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS no head - interno</title>
    <style>
        body {
            background-color: lightblue;
        }

        h1 {
            color: white;
            text-align: center;
        }

        p {
            font-family: Verdana, sans-serif;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <h1>CSS</h1>
    <p>CSS (Cascading Style Sheets) é uma linguagem usada para descrever a apresentação
        de um documento escrito em HTML ou XML. Com o CSS,
        você pode controlar a aparência de elementos na sua página web, como cores, fontes,
        espaçamento, layout e muito mais.
    </p>
</body>

</html>
