<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orçamentos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <script>
        $(document).ready(function () {

            // Parte 1 - pesquisa o usuário pelo nome
            $('#searchUsuarioButton').click(function () {
                var searchTerm = $('#usuarioSearchTerm').val();

                $.get('/usuarios/search', { searchTerm: searchTerm }, function (data) {
                    var results = '';

                    $.each(data, function (index, usuario) {
                        results += '<div class="usuario-result" data-usuario-id="' + usuario.id + '">'
                            + usuario.nomeUsuario + '</div>';
                    });

                    if (results === '') {
                        results = '<div class="text-muted p-2">Nenhum usuário encontrado.</div>';
                    }

                    $('#usuarioSearchResults').html(results);

                    // Parte 2 - ao clicar no nome, guarda o id no input hidden
                    $('.usuario-result').click(function () {
                        var idUsuario = $(this).data('usuario-id');
                        var nomeUsuario = $(this).text();

                        $('#selectedUsuarioName').text('Usuário selecionado: ' + nomeUsuario);
                        $('#idUsuario').val(idUsuario);
                        $('#usuarioSearchResults').empty();
                    });
                });
            });

        });
    </script>

    <style>
        body {
            background-color: #eef1f5;
            color: #2f3640;
        }

        .navbar {
            background: linear-gradient(90deg, #1f3c5c, #2f6f8f);
        }

        .navbar a {
            color: #fff;
        }

        .usuario-result {
            border: 1px solid #ccd3da;
            border-top: none;
            padding: 7px 10px;
            cursor: pointer;
            background-color: #fff;
        }

        .usuario-result:hover {
            background-color: #dbeaf3;
        }

        #selectedUsuarioName {
            margin-top: 8px;
            font-weight: 600;
            color: #1f6f4a;
        }

        .card {
            border: none;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        }

        .table thead th {
            background-color: #1f3c5c;
            color: #fff;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" href="/orcamentos">Sistema de orçamentos</a>
            <ul class="navbar-nav flex-row gap-3">
                <li class="nav-item"><a class="nav-link" href="/usuarios/pesquisa">Usuários</a></li>
                <li class="nav-item"><a class="nav-link" href="/orcamentos">Orçamentos</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4">

        <h1 class="h3 mb-3">Orçamentos</h1>

        <button type="button" class="btn btn-primary mb-4" data-bs-toggle="modal" data-bs-target="#addOrcamentoModal">
            Cadastrar orçamento
        </button>

        <div class="card">
            <div class="card-body">
                <h2 class="h5 mb-3">Orçamentos cadastrados</h2>

                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Usuário</th>
                            <th>Estado</th>
                            <th>Valor do orçamento</th>
                            <th>Valor do ICMS</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="orcamento : ${orcamentos}">
                            <td th:text="${orcamento.id}"></td>
                            <td th:text="${orcamento.usuario != null ? orcamento.usuario.nomeUsuario : 'Sem usuário'}"></td>
                            <td th:text="${orcamento.icmsEstados}"></td>
                            <td th:text="'R$ ' + ${#numbers.formatDecimal(orcamento.valorOrcamento, 1, 'POINT', 2, 'COMMA')}"></td>
                            <td th:text="'R$ ' + ${#numbers.formatDecimal(orcamento.valorICMS, 1, 'POINT', 2, 'COMMA')}"></td>
                            <td>
                                <form th:action="@{/orcamentos/delete/{id}(id=${orcamento.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-danger">Excluir</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <p class="text-muted fst-italic" th:if="${orcamentos.isEmpty()}">
                    Nenhum orçamento cadastrado até agora.
                </p>
            </div>
        </div>

    </div>

    <!-- Cadastro de orçamento -->
    <div class="modal fade" id="addOrcamentoModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form th:action="@{/orcamentos}" th:object="${newOrcamento}" method="post">

                    <div class="modal-header">
                        <h4 class="modal-title">Cadastrar orçamento</h4>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>

                    <div class="modal-body border-bottom">
                        <label class="form-label fw-semibold">Usuário</label>
                        <div class="row">
                            <div class="col-sm-8">
                                <input type="text" id="usuarioSearchTerm" class="form-control"
                                       placeholder="Digite o nome do usuário">
                                <div id="usuarioSearchResults"></div>
                                <div id="selectedUsuarioName"></div>
                                <!-- O id do usuário escolhido fica guardado aqui e vai junto no post -->
                                <input type="hidden" id="idUsuario" name="idUsuario">
                            </div>
                            <div class="col-sm-4">
                                <button type="button" id="searchUsuarioButton" class="btn btn-outline-primary">
                                    Pesquisar
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label" for="icmsEstados">Estado do ICMS</label>
                            <select id="icmsEstados" class="form-select" th:field="*{icmsEstados}" required>
                                <option value="">Selecione o estado</option>
                                <option th:each="estado : ${estados}"
                                        th:value="${estado}"
                                        th:text="${estado}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="valorOrcamento">Valor do orçamento</label>
                            <input type="number" step="0.01" min="0" id="valorOrcamento" class="form-control"
                                   th:field="*{valorOrcamento}" required>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
